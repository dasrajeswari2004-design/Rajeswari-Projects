<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - ShopEasy</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        /* LOGIN PAGE */

        .login-page {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 20px;

            background:
                linear-gradient(
                    135deg,
                    #6c5ce7,
                    #0984e3
                );
        }

        .login-card {

            width: 420px;
            max-width: 100%;

            background: white;

            padding: 45px 40px;

            border-radius: 25px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.20);

            text-align: center;

        }

        .login-logo {

            font-size: 55px;

            margin-bottom: 10px;

        }

        .login-card h1 {

            font-size: 30px;

            margin-bottom: 8px;

            color: #222;

        }

        .login-card .subtitle {

            color: #777;

            margin-bottom: 30px;

        }

        .input-group {

            text-align: left;

            margin-bottom: 18px;

        }

        .input-group label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;

        }

        .input-group input {

            width: 100%;

            padding: 14px 15px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

            transition: 0.3s;

        }

        .input-group input:focus {

            border-color: #6c5ce7;

            box-shadow:
                0 0 0 3px
                rgba(108,92,231,0.10);

        }

        .login-btn {

            width: 100%;

            padding: 15px;

            margin-top: 10px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    90deg,
                    #6c5ce7,
                    #0984e3
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

        }

        .login-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px
                rgba(108,92,231,0.30);

        }

        .demo-box {

            margin-top: 25px;

            padding: 15px;

            background: #f5f3ff;

            border-radius: 12px;

            color: #555;

            font-size: 14px;

        }

        .demo-box strong {

            color: #6c5ce7;

        }

        .login-footer {

            margin-top: 25px;

            color: #888;

            font-size: 13px;

        }

        @media (max-width: 500px) {

            .login-card {

                padding: 35px 25px;

            }

        }

    </style>

</head>


<body>


<section class="login-page">


    <div class="login-card">


        <!-- LOGO -->

        <div class="login-logo">

            🛒

        </div>


        <!-- TITLE -->

        <h1>

            Welcome to ShopEasy

        </h1>


        <p class="subtitle">

            Login to continue shopping

        </p>

        {% if error %}

            <p style="color: red; font-weight: bold; margin-bottom: 15px;">
                {{ error }}
            </p>
        {% endif %}

        {% if request.args.get("message") %}

            <p style="color: green; font-weight: bold; margin-bottom: 15px;">
                {{ request.args.get("message") }}
            </p>
        {% endif %}


        <!-- LOGIN FORM -->

        <form
            action="/login"
            method="POST"
        >


            <!-- USERNAME -->

            <div class="input-group">

                <label>
                    👤 Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <label>
                    🔑 Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-btn"
            >

                Login →

            </button>


        </form>


        <p class="login-footer">

            🛒 ShopEasy — Shop Smart. Live Better.

        </p>


    </div>


</section>


</body>

</html>
